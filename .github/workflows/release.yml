name: Release

# Push a tag matching the manifest version, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Runs the full CI first, then attaches the package to a GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('extension/src/manifest.json'))['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }

      - name: Build package
        run: make package

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Explicit notes: the generate-notes endpoint returned HTTP 500 for this repository.
        run: |
          prev=$(git tag --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -n1 || true)
          {
            echo "Install via Administration > Extensions with the attached zip. See the README for upgrade and uninstall notes."
            echo
            echo "## Changes"
            git log --no-merges --format='- %s' ${prev:+"$prev..$GITHUB_REF_NAME"}
          } > notes.md
          gh release create "$GITHUB_REF_NAME" build/*.zip --title "Email Archive $GITHUB_REF_NAME" --notes-file notes.md
